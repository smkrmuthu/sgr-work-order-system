name: Automated Database Backup (Every 2 Days)

on:
  schedule:
    # Run every 2 days at 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Generate Full Database Backup
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zuvmolgdmhbgqonzpjcg.supabase.co
      # A GitHub Actions secret (Settings -> Secrets and variables -> Actions -> New repository
      # secret, name it exactly this). This is CI infrastructure, not a browser, so it uses the
      # service_role key rather than the anon key the app itself ships — see scripts/db-backup.mjs
      # for why the anon key can never do this job at all.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20 (unlike the app's other workflows): @supabase/supabase-js's realtime client sets
          # up a WebSocket connection the moment createClient() runs, even though this script never uses
          # realtime features — and Node needs a native `WebSocket` global for that, which only exists
          # from Node 22 on. On 20 it throws immediately: "Node.js detected but native WebSocket not
          # found." (confirmed on a real run — this is what actually broke it, not the auth fix itself).
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Database Backup Files (.sql and .json)
        run: node scripts/db-backup.mjs

      - name: Encrypt the backup
        # This repository is public, and a workflow artifact of a public repository can be downloaded by any GitHub
        # account. A backup holds customers, prices and staff emails, so it is only ever uploaded encrypted. Add the
        # repository secret BACKUP_PASSPHRASE (Settings -> Secrets and variables -> Actions) and keep the same
        # passphrase somewhere safe: without it a backup cannot be opened. To open one:
        #   gpg --decrypt sgr_db_backup_YYYY-MM-DD.json.gpg > sgr_db_backup.json
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Repository secret BACKUP_PASSPHRASE is missing, so the backup is NOT uploaded (it would be public)."
            rm -rf backups
            exit 1
          fi
          cd backups
          for f in *; do
            printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
            rm "$f"
          done
          ls -l

      - name: Upload Backup Artifacts (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: sgr-db-backup-${{ github.sha }}
          path: backups/
          retention-days: 90
