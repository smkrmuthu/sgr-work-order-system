name: Automated Database Backup (Every 2 Days)

on:
  schedule:
    # Run every 2 days at 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Generate Full Database Backup
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zuvmolgdmhbgqonzpjcg.supabase.co
      # A GitHub Actions secret (Settings -> Secrets and variables -> Actions -> New repository
      # secret, name it exactly this). This is CI infrastructure, not a browser, so it uses the
      # service_role key rather than the anon key the app itself ships — see scripts/db-backup.mjs
      # for why the anon key can never do this job at all.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Database Backup Files (.sql and .json)
        run: node scripts/db-backup.mjs

      - name: Upload Backup Artifacts (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: sgr-db-backup-${{ github.sha }}
          path: backups/
          retention-days: 90
