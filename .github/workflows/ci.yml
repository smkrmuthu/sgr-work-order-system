name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so `next build`'s prerender step doesn't crash on
      # missing env vars. Nothing real is exercised at build time — this is a
      # static export with no server, so there's no live Supabase call during
      # `next build` itself.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:test
      - run: npm run typecheck
      - run: npm run build
